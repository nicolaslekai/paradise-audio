name: Saturation
options:
  bundleIdPrefix: com.paradise
  deploymentTarget: { macOS: "12.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
targets:
  SaturationApp:
    type: application
    platform: macOS
    sources: [{ path: SaturationApp }]
    info:
      path: SaturationApp/Info.plist
      properties:
        CFBundleName: Saturation
        CFBundleDisplayName: Saturation
        CFBundleIdentifier: com.paradise.Saturation
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "12.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    dependencies: [{ target: SaturationExtension }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paradise.Saturation
        PRODUCT_NAME: Saturation
        INFOPLIST_FILE: SaturationApp/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
  SaturationExtension:
    type: app-extension
    platform: macOS
    sources: [{ path: SaturationExtension }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paradise.Saturation.Extension
        PRODUCT_NAME: SaturationExtension
        INFOPLIST_FILE: SaturationExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: SaturationExtension/SaturationExtension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: SaturationExtension/SaturationExtension-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_OBJC_WEAK: YES
