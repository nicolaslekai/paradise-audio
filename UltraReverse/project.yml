name: UltraReverse
options:
  bundleIdPrefix: com.paradise
  deploymentTarget: { macOS: "12.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
targets:
  UltraReverseApp:
    type: application
    platform: macOS
    sources: [{ path: UltraReverseApp }]
    info:
      path: UltraReverseApp/Info.plist
      properties:
        CFBundleName: UltraReverse
        CFBundleDisplayName: Ultra Reverse
        CFBundleIdentifier: com.paradise.UltraReverse
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "12.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    dependencies: [{ target: UltraReverseExtension }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paradise.UltraReverse
        PRODUCT_NAME: UltraReverse
        INFOPLIST_FILE: UltraReverseApp/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
  UltraReverseExtension:
    type: app-extension
    platform: macOS
    sources: [{ path: UltraReverseExtension }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paradise.UltraReverse.Extension
        PRODUCT_NAME: UltraReverseExtension
        INFOPLIST_FILE: UltraReverseExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: UltraReverseExtension/UltraReverseExtension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: UltraReverseExtension/UltraReverseExtension-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_OBJC_WEAK: YES
        # Pre-Verb convolution (vendored FFTConvolver, MIT) on Apple's FFT.
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "AUDIOFFT_APPLE_ACCELERATE=1"]
    dependencies:
      - sdk: Accelerate.framework
