name: Reverb
options:
  bundleIdPrefix: com.paradise
  deploymentTarget: { macOS: "12.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
targets:
  ReverbApp:
    type: application
    platform: macOS
    sources: [{ path: ReverbApp }]
    info:
      path: ReverbApp/Info.plist
      properties:
        CFBundleName: Reverb
        CFBundleDisplayName: Reverb
        CFBundleIdentifier: com.paradise.Reverb
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "12.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    dependencies: [{ target: ReverbExtension }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paradise.Reverb
        PRODUCT_NAME: Reverb
        INFOPLIST_FILE: ReverbApp/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
  ReverbExtension:
    type: app-extension
    platform: macOS
    sources: [{ path: ReverbExtension }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paradise.Reverb.Extension
        PRODUCT_NAME: ReverbExtension
        INFOPLIST_FILE: ReverbExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ReverbExtension/ReverbExtension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: ReverbExtension/ReverbExtension-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_OBJC_WEAK: YES
