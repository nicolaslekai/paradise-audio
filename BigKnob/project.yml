name: BigKnob
options:
  bundleIdPrefix: com.paradise
  deploymentTarget: { macOS: "12.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
targets:
  BigKnobApp:
    type: application
    platform: macOS
    sources: [{ path: BigKnobApp }]
    info:
      path: BigKnobApp/Info.plist
      properties:
        CFBundleName: BigKnob
        CFBundleDisplayName: Big Knob
        CFBundleIdentifier: com.paradise.BigKnob
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "12.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    dependencies: [{ target: BigKnobExtension }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paradise.BigKnob
        PRODUCT_NAME: BigKnob
        INFOPLIST_FILE: BigKnobApp/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
  BigKnobExtension:
    type: app-extension
    platform: macOS
    sources: [{ path: BigKnobExtension }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paradise.BigKnob.Extension
        PRODUCT_NAME: BigKnobExtension
        INFOPLIST_FILE: BigKnobExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: BigKnobExtension/BigKnobExtension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: BigKnobExtension/BigKnobExtension-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_OBJC_WEAK: YES
