name: Drums
options:
  bundleIdPrefix: com.paradise
  deploymentTarget: { macOS: "12.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
targets:
  DrumsApp:
    type: application
    platform: macOS
    sources: [{ path: DrumsApp }]
    info:
      path: DrumsApp/Info.plist
      properties:
        CFBundleName: Drums
        CFBundleDisplayName: Engine 909
        CFBundleIdentifier: com.paradise.Drums
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "12.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSUIElement: true
    dependencies: [{ target: DrumsExtension }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paradise.Drums
        PRODUCT_NAME: Drums
        INFOPLIST_FILE: DrumsApp/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
  DrumsExtension:
    type: app-extension
    platform: macOS
    sources: [{ path: DrumsExtension }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paradise.Drums.Extension
        PRODUCT_NAME: DrumsExtension
        INFOPLIST_FILE: DrumsExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: DrumsExtension/DrumsExtension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: DrumsExtension/DrumsExtension-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_OBJC_WEAK: YES
