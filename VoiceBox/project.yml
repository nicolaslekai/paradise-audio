name: VoiceBox
options:
  bundleIdPrefix: com.paradise
  deploymentTarget: { macOS: "12.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
targets:
  VoiceBoxApp:
    type: application
    platform: macOS
    sources: [{ path: VoiceBoxApp }]
    info:
      path: VoiceBoxApp/Info.plist
      properties:
        CFBundleName: VoiceBox
        CFBundleDisplayName: Voice Box
        CFBundleIdentifier: com.paradise.VoiceBox
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "12.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    dependencies: [{ target: VoiceBoxExtension }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paradise.VoiceBox
        PRODUCT_NAME: VoiceBox
        INFOPLIST_FILE: VoiceBoxApp/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
  VoiceBoxExtension:
    type: app-extension
    platform: macOS
    sources: [{ path: VoiceBoxExtension }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paradise.VoiceBox.Extension
        PRODUCT_NAME: VoiceBoxExtension
        INFOPLIST_FILE: VoiceBoxExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: VoiceBoxExtension/VoiceBoxExtension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: VoiceBoxExtension/VoiceBoxExtension-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_OBJC_WEAK: YES
    dependencies:
      - sdk: Accelerate.framework
