name: Limiter
options:
  bundleIdPrefix: com.anthropic
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"

targets:
  LimiterApp:
    type: application
    platform: macOS
    sources:
      - path: LimiterApp
    info:
      path: LimiterApp/Info.plist
      properties:
        CFBundleName: Limiter
        CFBundleDisplayName: Limiter
        CFBundleIdentifier: com.anthropic.Limiter
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "12.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    dependencies:
      - target: LimiterExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anthropic.Limiter
        PRODUCT_NAME: Limiter
        INFOPLIST_FILE: LimiterApp/Info.plist
        ENABLE_HARDENED_RUNTIME: YES

  LimiterExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: LimiterExtension
    dependencies:
      - sdk: Accelerate.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anthropic.Limiter.Extension
        PRODUCT_NAME: LimiterExtension
        INFOPLIST_FILE: LimiterExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: LimiterExtension/LimiterExtension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: LimiterExtension/LimiterExtension-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_OBJC_WEAK: YES
