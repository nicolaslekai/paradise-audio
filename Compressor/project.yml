name: Compressor
options:
  bundleIdPrefix: com.anthropic
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"

targets:
  CompressorApp:
    type: application
    platform: macOS
    sources:
      - path: CompressorApp
    info:
      path: CompressorApp/Info.plist
      properties:
        CFBundleName: Compressor
        CFBundleDisplayName: Compressor
        CFBundleIdentifier: com.anthropic.Compressor
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "12.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    dependencies:
      - target: CompressorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anthropic.Compressor
        PRODUCT_NAME: Compressor
        INFOPLIST_FILE: CompressorApp/Info.plist
        ENABLE_HARDENED_RUNTIME: YES

  CompressorExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: CompressorExtension
    dependencies:
      - sdk: Accelerate.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anthropic.Compressor.Extension
        PRODUCT_NAME: CompressorExtension
        INFOPLIST_FILE: CompressorExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: CompressorExtension/CompressorExtension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: CompressorExtension/CompressorExtension-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_OBJC_WEAK: YES
