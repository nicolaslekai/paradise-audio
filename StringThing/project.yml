name: StringThing
options:
  bundleIdPrefix: com.paradise
  deploymentTarget: { macOS: "12.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
targets:
  StringThingApp:
    type: application
    platform: macOS
    sources: [{ path: StringThingApp }]
    info:
      path: StringThingApp/Info.plist
      properties:
        CFBundleName: StringThing
        CFBundleDisplayName: String Thing
        CFBundleIdentifier: com.paradise.StringThing
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "12.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSUIElement: true
    dependencies: [{ target: StringThingExtension }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paradise.StringThing
        PRODUCT_NAME: StringThing
        INFOPLIST_FILE: StringThingApp/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
  StringThingExtension:
    type: app-extension
    platform: macOS
    sources: [{ path: StringThingExtension }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paradise.StringThing.Extension
        PRODUCT_NAME: StringThingExtension
        INFOPLIST_FILE: StringThingExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: StringThingExtension/StringThingExtension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: StringThingExtension/StringThingExtension-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_OBJC_WEAK: YES
