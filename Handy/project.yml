name: Handy
options:
  bundleIdPrefix: com.paradise
  deploymentTarget: { macOS: "12.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
targets:
  HandyApp:
    type: application
    platform: macOS
    sources: [{ path: HandyApp }]
    info:
      path: HandyApp/Info.plist
      properties:
        CFBundleName: Handy
        CFBundleDisplayName: Handy Boy
        CFBundleIdentifier: com.paradise.Handy
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "12.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    dependencies: [{ target: HandyExtension }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paradise.Handy
        PRODUCT_NAME: Handy
        INFOPLIST_FILE: HandyApp/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
  HandyExtension:
    type: app-extension
    platform: macOS
    sources: [{ path: HandyExtension }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paradise.Handy.Extension
        PRODUCT_NAME: HandyExtension
        INFOPLIST_FILE: HandyExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: HandyExtension/HandyExtension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: HandyExtension/HandyExtension-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_OBJC_WEAK: YES
